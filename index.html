<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPhone 13 Prototype</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0b0b; /* Dark backdrop for desktop framing */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            overflow: hidden;
        }

        /* iPhone 13 Frame locked to exact 390x844 aspect ratio */
        .phone-frame {
            width: 100vw;
            height: 100dvh;
            max-width: 390px;
            max-height: 844px;
            aspect-ratio: 390 / 844;
            background-color: #000;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
        }

        /* Add a sleek phone border and rounding when viewed on larger screens (like a laptop) */
        @media (min-width: 420px) {
            .phone-frame {
                border-radius: 44px;
                border: 12px solid #1c1c1e;
                height: 85dvh; /* Leaves breathing room on desktop */
            }
        }

        .scrollable-image {
            width: 100%;
            display: block;
            height: auto;
        }

        /* Hide scrollbars for a native app feel */
        .phone-frame::-webkit-scrollbar {
            display: none;
        }
        .phone-frame {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <img src="app-screen.jpeg" alt="App Screen" class="scrollable-image">
    </div>

</body>
</html>
