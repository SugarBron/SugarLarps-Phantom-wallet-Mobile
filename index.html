<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phantom Wallet Prototype</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0b0b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            overflow: hidden;
        }

        /* iPhone 13 Container */
        .phone-frame {
            width: 100%;
            max-width: 390px;
            height: 100dvh;
            max-height: 844px;
            aspect-ratio: 390 / 844;
            background-color: #000;
            border-radius: 44px;
            border: 10px solid #1c1c1e;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
        }

        /* View Containers */
        .screen-view {
            width: 100%;
            position: relative;
        }

        .scrollable-image {
            width: 100%;
            display: block;
            height: auto;
        }

        /* Hide Scrollbars */
        .phone-frame::-webkit-scrollbar {
            display: none;
        }
        .phone-frame {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Clickable Hotspot overlay over Cash card */
        .cash-hotspot {
            position: absolute;
            top: 17%;    /* Positioned right over the Cash card */
            left: 5%;
            width: 90%;
            height: 7%;
            cursor: pointer;
            z-index: 10;
        }

        /* Hidden class to switch screens */
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="phone-frame" id="phoneFrame">
        
        <!-- View 1: Main Screen -->
        <div id="mainView" class="screen-view">
            <div class="cash-hotspot" onclick="openCashScreen()"></div>
            <img src="app-screen.jpeg" alt="Main Screen" class="scrollable-image">
        </div>

        <!-- View 2: Cash Screen (Initially Hidden) -->
        <div id="cashView" class="screen-view hidden" onclick="closeCashScreen()">
            <img src="cash-screen.jpeg" alt="Cash Screen" class="scrollable-image">
        </div>

    </div>

    <script>
        function openCashScreen() {
            document.getElementById('mainView').classList.add('hidden');
            document.getElementById('cashView').classList.remove('hidden');
            // Scroll back to top when switching views
            document.getElementById('phoneFrame').scrollTop = 0;
        }

        function closeCashScreen() {
            document.getElementById('cashView').classList.add('hidden');
            document.getElementById('mainView').classList.remove('hidden');
            document.getElementById('phoneFrame').scrollTop = 0;
        }
    </script>

</body>
</html>
