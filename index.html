<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPhone 13 Prototype</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0b0b; /* Backdrop framing the phone */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            overflow: hidden;
        }

        /* iPhone 13 Frame with forced rounded corners and border everywhere */
        .phone-frame {
            width: 100%;
            max-width: 390px;
            height: 100dvh;
            max-height: 844px;
            aspect-ratio: 390 / 844;
            background-color: #000;
            border-radius: 44px; /* Matches iPhone rounded screen corners */
            border: 10px solid #1c1c1e; /* Physical phone bezel look */
            overflow-y: auto;
            position: relative;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
        }

        .scrollable-image {
            width: 100%;
            display: block;
            height: auto;
        }

        /* Hide scrollbars */
        .phone-frame::-webkit-scrollbar {
            display: none;
        }
        .phone-frame {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <img src="app-screen.jpeg" alt="App Screen" class="scrollable-image">
    </div>

</body>
</html>
