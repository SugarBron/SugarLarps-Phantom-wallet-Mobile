<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phantom Wallet Prototype</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0b0b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            overflow: hidden;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Fluid container for mobile, locked aspect-ratio for desktop */
        .phone-frame {
            width: 100vw;
            height: 100dvh;
            background-color: #000;
            overflow: hidden;
            position: relative;
        }

        @media (min-width: 450px) {
            .phone-frame {
                width: 390px;
                height: 844px;
                aspect-ratio: 390 / 844;
                border-radius: 44px;
                border: 10px solid #1c1c1e;
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            }
        }

        /* View Containers */
        .screen-view {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            overflow-y: auto;
            background-color: #000;
            transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
        }

        .scrollable-image {
            width: 100%;
            display: block;
            height: auto;
            padding-bottom: 90px;
        }

        /* Dynamic Text Layers */
        .dynamic-total-balance {
            position: absolute;
            top: 9.3%; /* Adjust if needed to cover the total balance area */
            left: 5%;
            color: #ffffff;
            font-size: 28px;
            font-weight: 700;
            z-index: 5;
            pointer-events: none;
        }

        .dynamic-cash-amount {
            position: absolute;
            top: 25.3%; /* Adjust if needed to cover the cash row area */
            right: 10%;
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            z-index: 5;
            pointer-events: none;
        }

        /* Fixed Sticky Bottom Search Bar */
        .sticky-bottom-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 5;
            pointer-events: none;
        }

        .sticky-bottom-bar img {
            width: 100%;
            display: block;
            pointer-events: auto;
        }

        /* Hide Scrollbars */
        .phone-frame::-webkit-scrollbar,
        .screen-view::-webkit-scrollbar {
            display: none;
        }
        .phone-frame,
        .screen-view {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Clickable Hotspot over Cash card */
        .cash-hotspot {
            position: absolute;
            top: 22%;
            left: 5%;
            width: 90%;
            height: 7%;
            cursor: pointer;
            z-index: 10;
        }

        /* Animation States for Bottom-Up Sheet */
        #cashView {
            transform: translateY(100%);
            z-index: 20;
        }

        #cashView.active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="phone-frame" id="phoneFrame">
        
        <!-- View 1: Main Screen (Scrollable) -->
        <div id="mainView" class="screen-view">
            <div class="cash-hotspot" onclick="openCashScreen()"></div>
            <img src="app-screen.jpeg" alt="Main Screen" class="scrollable-image">
            
            <!-- Dynamic Text Overlays -->
            <div class="dynamic-total-balance" id="totalDisplay">€24.65</div>
            <div class="dynamic-cash-amount" id="cashDisplay">€23.33</div>
        </div>

        <!-- Sticky Bottom Bar -->
        <div class="sticky-bottom-bar" id="stickyBar">
            <img src="bottom-bar.jpeg" alt="Search Bar">
        </div>

        <!-- View 2: Cash Screen (Slide-up sheet) -->
        <div id="cashView" class="screen-view">
            <img src="cash-screen.jpeg" alt="Cash Screen" class="scrollable-image" style="padding-bottom: 0;">
        </div>

    </div>

    <script>
        // Prompt user and automatically update Cash + calculate Total Balance (+ 1.31€ Solana)
        window.addEventListener('DOMContentLoaded', () => {
            let userNumber = prompt("Enter the Cash amount (e.g., 23.33):", "23.33");
            if (userNumber !== null && userNumber.trim() !== "") {
                let cashVal = parseFloat(userNumber) || 0;
                let totalVal = cashVal + 1.31; // Adds the 1.31€ Solana value automatically

                document.getElementById('cashDisplay').innerText = "€" + cashVal.toFixed(2);
                document.getElementById('totalDisplay').innerText = "€" + totalVal.toFixed(2);
            }
        });

        const cashView = document.getElementById('cashView');
        const stickyBar = document.getElementById('stickyBar');
        let startY = 0;
        let currentY = 0;
        let isDragging = false;

        function openCashScreen() {
            cashView.scrollTop = 0;
            cashView.style.transform = '';
            cashView.classList.add('active');
            stickyBar.style.display = 'none';
        }

        function closeCashScreen() {
            cashView.style.transform = '';
            cashView.classList.remove('active');
            stickyBar.style.display = 'block';
        }

        /* Touch Gestures for Swipe-Down-To-Close */
        cashView.addEventListener('touchstart', (e) => {
            if (cashView.scrollTop <= 0) {
                startY = e.touches[0].clientY;
                isDragging = true;
            }
        }, { passive: true });

        cashView.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            currentY = e.touches[0].clientY;
            let diff = currentY - startY;

            if (diff > 0) {
                cashView.style.transition = 'none';
                cashView.style.transform = `translateY(${diff}px)`;
            }
        }, { passive: true });

        cashView.addEventListener('touchend', () => {
            if (!isDragging) return;
            isDragging = false;
            let diff = currentY - startY;

            cashView.style.transition = 'transform 0.35s cubic-bezier(0.32, 0.72, 0, 1)';
            
            if (diff > 120) {
                closeCashScreen();
            } else {
                cashView.style.transform = 'translateY(0)';
            }
        });
    </script>

</body>
</html>
