<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phantom Wallet Prototype</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0b0b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            overflow: hidden;
        }

        /* iPhone 13 Container */
        .phone-frame {
            width: 100%;
            max-width: 390px;
            height: 100dvh;
            max-height: 844px;
            aspect-ratio: 390 / 844;
            background-color: #000;
            border-radius: 44px;
            border: 10px solid #1c1c1e;
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
        }

        /* View Containers */
        .screen-view {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            overflow-y: auto;
            background-color: #000;
            transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
        }

        .scrollable-image {
            width: 100%;
            display: block;
            height: auto;
        }

        /* Hide Scrollbars */
        .phone-frame::-webkit-scrollbar,
        .screen-view::-webkit-scrollbar {
            display: none;
        }
        .phone-frame,
        .screen-view {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Clickable Hotspot over Cash card */
        .cash-hotspot {
            position: absolute;
            top: 17%;
            left: 5%;
            width: 90%;
            height: 7%;
            cursor: pointer;
            z-index: 10;
        }

        /* Animation States for Bottom-Up Sheet */
        #cashView {
            transform: translateY(100%);
            z-index: 20;
        }

        #cashView.active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="phone-frame" id="phoneFrame">
        
        <!-- View 1: Main Screen -->
        <div id="mainView" class="screen-view">
            <div class="cash-hotspot" onclick="openCashScreen()"></div>
            <img src="app-screen.jpeg" alt="Main Screen" class="scrollable-image">
        </div>

        <!-- View 2: Cash Screen (Slide-up sheet with swipe-down support) -->
        <div id="cashView" class="screen-view">
            <img src="cash-screen.jpeg" alt="Cash Screen" class="scrollable-image">
        </div>

    </div>

    <script>
        const cashView = document.getElementById('cashView');
        let startY = 0;
        let currentY = 0;
        let isDragging = false;

        function openCashScreen() {
            cashView.scrollTop = 0;
            cashView.style.transform = '';
            cashView.classList.add('active');
        }

        function closeCashScreen() {
            cashView.style.transform = '';
            cashView.classList.remove('active');
        }

        /* Touch Gestures for Swipe-Down-To-Close */
        cashView.addEventListener('touchstart', (e) => {
            // Only allow dragging down if scrolled all the way to the top
            if (cashView.scrollTop <= 0) {
                startY = e.touches[0].clientY;
                isDragging = true;
            }
        }, { passive: true });

        cashView.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            currentY = e.touches[0].clientY;
            let diff = currentY - startY;

            // If pulling downwards
            if (diff > 0) {
                cashView.style.transition = 'none';
                cashView.style.transform = `translateY(${diff}px)`;
            }
        }, { passive: true });

        cashView.addEventListener('touchend', () => {
            if (!isDragging) return;
            isDragging = false;
            let diff = currentY - startY;

            cashView.style.transition = 'transform 0.35s cubic-bezier(0.32, 0.72, 0, 1)';
            
            // If swiped down past 120px, close it; otherwise snap back up
            if (diff > 120) {
                closeCashScreen();
            } else {
                cashView.style.transform = 'translateY(0)';
            }
        });
    </script>

</body>
</html>
